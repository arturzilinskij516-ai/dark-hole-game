<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Тёмная Дыра</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0510;font-family:Arial,sans-serif;touch-action:none}
#game{display:block;width:100vw;height:100vh;position:fixed;top:0;left:0}
#startScreen{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#2a1050,#0a0510 70%);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;z-index:100;color:#fff;text-align:center;padding:20px}
#startScreen h1{font-size:48px;color:#ffcc55;text-shadow:0 0 20px #ff8800,0 0 40px #ff4400;margin-bottom:10px}
#startScreen p{font-size:20px;color:#ccc}
#startBtn{padding:26px 70px;font-size:34px;font-weight:bold;color:#1a0a2e;background:linear-gradient(180deg,#ffd966,#ffaa22);border:none;border-radius:50px;cursor:pointer;box-shadow:0 8px 20px rgba(255,170,34,.5);transition:transform .1s}
#startBtn:active{transform:scale(.96)}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="startScreen">
  <h1>🕳️ ТЁМНАЯ ДЫРА</h1>
  <p>Управляй дырой мышкой или пальцем</p>
  <p>Лови фрукты и монеты — избегай черепов 💀</p>
  <button id="startBtn">▶ ИГРАТЬ</button>
</div>

<script>
'use strict';

// === VK BRIDGE INIT ===
if (window.vkBridge) {
  vkBridge.send('VKWebAppInit').catch(function(e){ console.log('VK init:', e); });
} else {
  console.log('VK Bridge не загружен');
}

// ==================== КАНВАС ====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// ==================== СОСТОЯНИЕ ====================
const state = {
  running: false, gameOver: false,
  coins: 0, lives: 3, maxLives: 3,
  speedLevel: 0, nextSpeedAt: 10,
  time: 0, shake: 0,
  boostActive: false, boostTimer: 0, boostDuration: 10, boostMult: 5,
  upgradeSlow: 0, upgradeMagnet: 0, upgradeHoleSkin: 0
};

// ==================== ЗВУК ====================
let audioCtx = null;
let audioEnabled = true;
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, dur, type='sine', vol=0.3, freqEnd=null){
  if(!audioCtx || !audioEnabled) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if(freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + dur);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
function playNoise(dur, vol=0.3){
  if(!audioCtx || !audioEnabled) return;
  try {
    const bufSize = audioCtx.sampleRate * dur;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * Math.pow(1-i/bufSize, 2);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    src.connect(gain); gain.connect(audioCtx.destination);
    src.start();
  } catch(e){}
}
function sfxPop(){ playTone(800, 0.15, 'sine', 0.4, 300); }
function sfxCoin(){ playTone(1200, 0.15, 'sine', 0.4); setTimeout(()=>playTone(1800,0.15,'sine',0.3),60); setTimeout(()=>playTone(2400,0.15,'sine',0.2),120); }
function sfxGolden(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>playTone(f,0.3,'sine',0.3),i*80)); }
function sfxSplat(){ playNoise(0.3, 0.4); playTone(150, 0.3, 'sine', 0.3); }
function sfxHurt(){ playTone(220, 0.2, 'sine', 0.5); }
function sfxDeath(){ playTone(400, 1.0, 'sawtooth', 0.4, 50); playNoise(0.8, 0.3); }

// ==================== ФРУКТЫ ====================
const FRUITS = [
  { emoji:'🍎', color:'#e84040' },
  { emoji:'🍊', color:'#ff9520' },
  { emoji:'🍋', color:'#ffd820' },
  { emoji:'🍐', color:'#a8d840' },
  { emoji:'🍇', color:'#9a30b8' },
  { emoji:'🍌', color:'#ffd820' },
  { emoji:'🍉', color:'#e84060' }
];

// ==================== МАССИВЫ ====================
const objects = [];
const particles = [];
const clouds = [];
const stars = [];
const grassBlades = [];

// ==================== ДЫРА ====================
const hole = {
  x: W/2, y: H - 130,
  rot: 0, pulse: 0,
  hue: {r:255, g:80, b:30}
};

// ==================== УПРАВЛЕНИЕ ====================
let mouseX = W/2;
function updateMouse(x){ mouseX = Math.max(110, Math.min(W-110, x)); }
canvas.addEventListener('mousemove', e => updateMouse(e.clientX));
canvas.addEventListener('touchmove', e => { e.preventDefault(); updateMouse(e.touches[0].clientX); }, {passive:false});
canvas.addEventListener('touchstart', e => { e.preventDefault(); updateMouse(e.touches[0].clientX); }, {passive:false});

// ==================== ФОН ====================
function initBackground(){
  for(let i=0;i<120;i++){
    stars.push({
      x: Math.random()*W, y: Math.random()*H*0.6,
      size: 0.5 + Math.random()*1.5,
      phase: Math.random()*Math.PI*2,
      speed: 0.5 + Math.random()*2
    });
  }
  for(let i=0;i<6;i++){
    clouds.push({
      x: Math.random()*W, y: 60 + Math.random()*250,
      scale: 0.7 + Math.random()*0.8,
      speed: 10 + Math.random()*20,
      alpha: 0.3 + Math.random()*0.4
    });
  }
  for(let i=0;i<200;i++){
    const layer = i < 80 ? 0 : (i < 140 ? 1 : 2);
    grassBlades.push({
      x: Math.random()*W,
      y: H - 128 + layer*3 - Math.random()*10,
      h: 8 + layer*4 + Math.random()*(12+layer*8),
      phase: Math.random()*Math.PI*2,
      speed: 0.8 + Math.random()*0.8,
      color: `hsl(${90+Math.random()*40}, ${50+layer*10}%, ${20+layer*10}%)`,
      layer: layer
    });
  }
}
initBackground();

// ==================== СПАВН ====================
function spawnObject(){
  const roll = Math.random();
  let type = 'fruit';
  if(roll < 0.03) type = 'golden';
  else if(roll < 0.03 + 0.15) type = 'coin';
  else if(roll < 0.03 + 0.15 + 0.10) type = 'skull';

  const obj = {
    type: type,
    x: 90 + Math.random()*(W-180),
    y: -80, vy: 0,
    spin: (Math.random()-0.5)*2,
    rot: 0, phase: Math.random()*Math.PI*2,
    wobble: 0,
    fruitIndex: type === 'fruit' ? Math.floor(Math.random()*FRUITS.length) : -1
  };
  if(type === 'golden') obj.spin = (Math.random()-0.5)*4;
  objects.push(obj);
}

// ==================== ЧАСТИЦЫ ====================
function spawnParticles(x, y, color, count, speed=1){
  for(let i=0;i<count;i++){
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*400*speed,
      vy: (Math.random()-0.7)*500*speed,
      life: 0.8 + Math.random()*0.5,
      maxLife: 0.8, color: color,
      size: 4 + Math.random()*10
    });
  }
}
function spawnFlash(x, y, color){
  particles.push({
    x, y, vx: 0, vy: 0,
    life: 0.5, maxLife: 0.5,
    color: color, size: 40, flash: true
  });
}

// ==================== ОБНОВЛЕНИЕ ====================
let spawnTimer = 0;
let lastTime = performance.now();

function update(dt){
  state.time += dt;
  if(state.shake > 0) state.shake = Math.max(0, state.shake - dt*2);
  if(state.boostActive){
    state.boostTimer -= dt;
    if(state.boostTimer <= 0) state.boostActive = false;
  }

  const dx = mouseX - hole.x;
  hole.x += dx * Math.min(1, dt * 15);
  hole.rot += dt * 1.3;
  hole.pulse += dt * 2.2;

  spawnTimer -= dt;
  if(spawnTimer <= 0 && !state.gameOver){
    spawnTimer = 1.0;
    spawnObject();
  }

  const speedMult = (1 + state.speedLevel*0.12) * (1 - state.upgradeSlow*0.12) * (state.boostActive ? state.boostMult : 1);

  for(let i = objects.length-1; i >= 0; i--){
    const o = objects[i];
    o.vy += 100 * dt * speedMult;
    o.y += o.vy * dt;
    o.rot += o.spin * dt;
    if(o.type !== 'skull') o.wobble = Math.sin(state.time*2 + o.phase) * 15;

    const px = o.x + o.wobble;

    if(state.upgradeMagnet > 0 && o.type !== 'skull' && o.type !== 'golden'){
      const mr = 120 + state.upgradeMagnet*100;
      const mdx = hole.x - px;
      const mdy = hole.y - o.y;
      const dist = Math.sqrt(mdx*mdx + mdy*mdy);
      if(dist < mr && dist > 0){
        const force = (1 - dist/mr) * 400;
        o.x += (mdx/dist) * force * dt;
        o.y += (mdy/dist) * force * dt * 0.3;
      }
    }

    const dxb = Math.abs(px - hole.x);
    const dyb = Math.abs(o.y - hole.y);
    if(dxb < 90 && dyb < 70){
      handleCatch(o);
      objects.splice(i, 1);
      continue;
    }

    if(o.y > H + 80){
      if(o.type === 'fruit'){
        state.lives--;
        sfxSplat(); sfxHurt();
        state.shake = 1;
        if(state.lives <= 0) gameOver();
      }
      objects.splice(i, 1);
    }
  }

  for(let i = particles.length-1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    if(!p.flash){
      p.vy += 500*dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  for(const c of clouds){
    c.x += c.speed * dt;
    if(c.x > W + 200) c.x = -200;
  }
}

function handleCatch(o){
  const px = o.x + o.wobble;
  if(o.type === 'skull'){
    sfxDeath();
    state.shake = 3;
    spawnParticles(px, o.y, '#ff0000', 50, 1.5);
    spawnParticles(px, o.y, '#8000ff', 30, 1.2);
    spawnFlash(px, o.y, '#ff0000');
    state.lives = 0;
    gameOver();
    return;
  }
  if(o.type === 'golden'){
    sfxGolden();
    state.boostActive = true;
    state.boostTimer = state.boostDuration;
    state.shake = 1.5;
    spawnParticles(px, o.y, '#ffd820', 40, 1.4);
    spawnFlash(px, o.y, '#ffd820');
    return;
  }
  if(o.type === 'coin'){
    state.coins++;
    sfxCoin();
    spawnParticles(px, o.y, '#ffd820', 15);
    spawnFlash(px, o.y, '#ffcc55');
    if(state.coins >= state.nextSpeedAt){
      state.speedLevel++;
      state.nextSpeedAt += 10;
      spawnFlash(W/2, 150, '#88eeff');
    }
    return;
  }
  sfxPop();
  const fruit = FRUITS[o.fruitIndex];
  spawnParticles(px, o.y, fruit.color, 15);
  spawnFlash(px, o.y, fruit.color);
}

// ==================== РИСОВАНИЕ ====================
function draw(){
  ctx.save();
  if(state.shake > 0){
    ctx.translate((Math.random()-0.5)*state.shake*20, (Math.random()-0.5)*state.shake*20);
  }
  drawSky();
  drawSun();
  drawMountains();
  drawClouds();
  drawStars();
  drawGround();
  drawGrass();
  for(const o of objects) drawObject(o);
  drawParticles();
  drawHole();
  drawUI();
  ctx.restore();
}

function drawSky(){
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#1a3a7a');
  grad.addColorStop(0.4, '#4a8ad8');
  grad.addColorStop(0.7, '#a8d8f0');
  grad.addColorStop(0.85, '#ffd88a');
  grad.addColorStop(1, '#ff9055');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawSun(){
  const sx = W*0.75, sy = H*0.22;
  const pulse = 1 + Math.sin(state.time*1.5)*0.05;
  const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, 200*pulse);
  grad.addColorStop(0, 'rgba(255,240,180,0.5)');
  grad.addColorStop(0.5, 'rgba(255,220,120,0.15)');
  grad.addColorStop(1, 'rgba(255,200,80,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(sx-250, sy-250, 500, 500);
  const grad2 = ctx.createRadialGradient(sx, sy, 0, sx, sy, 60);
  grad2.addColorStop(0, '#fffff0');
  grad2.addColorStop(0.6, '#ffea80');
  grad2.addColorStop(1, '#ffaa30');
  ctx.fillStyle = grad2;
  ctx.beginPath();
  ctx.arc(sx, sy, 60*pulse, 0, Math.PI*2);
  ctx.fill();
}

function drawMountains(){
  const layers = [
    { h: 120, y: H-260, color: 'rgba(80,90,130,0.5)' },
    { h: 100, y: H-230, color: 'rgba(60,65,100,0.7)' },
    { h: 80, y: H-200, color: 'rgba(40,45,70,0.9)' }
  ];
  for(const layer of layers){
    ctx.fillStyle = layer.color;
    ctx.beginPath();
    ctx.moveTo(0, layer.y + layer.h);
    let x = 0;
    while(x < W + 100){
      const seed = Math.sin(Math.floor(x/60));
      const seedH = layer.h * (0.5 + seed*0.3);
      ctx.lineTo(x, layer.y + layer.h - seedH);
      x += 60;
      ctx.lineTo(x, layer.y + layer.h);
      x += 40;
    }
    ctx.lineTo(W, layer.y + layer.h);
    ctx.lineTo(W, H); ctx.lineTo(0, H);
    ctx.closePath(); ctx.fill();
  }
}

function drawClouds(){
  for(const c of clouds){
    ctx.save();
    ctx.globalAlpha = c.alpha;
    ctx.fillStyle = '#ffffff';
    const s = c.scale;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 30*s, 0, Math.PI*2);
    ctx.arc(c.x + 30*s, c.y - 10*s, 40*s, 0, Math.PI*2);
    ctx.arc(c.x + 70*s, c.y, 35*s, 0, Math.PI*2);
    ctx.arc(c.x + 35*s, c.y + 15*s, 28*s, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function drawStars(){
  for(const s of stars){
    const tw = 0.3 + Math.sin(state.time*s.speed + s.phase)*0.4 + 0.3;
    ctx.globalAlpha = tw;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawGround(){
  const grad = ctx.createLinearGradient(0, H-130, 0, H);
  grad.addColorStop(0, '#3a2820');
  grad.addColorStop(1, '#1a0f0a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H-130, W, 130);
  ctx.fillStyle = 'rgba(60,40,25,0.9)';
  ctx.fillRect(0, H-130, W, 4);
}

function drawGrass(){
  const wind = Math.sin(state.time*0.5)*0.3 + 0.7;
  for(const g of grassBlades){
    const sway = Math.sin(state.time*g.speed + g.phase)*0.2*g.layer*wind;
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(sway);
    ctx.strokeStyle = g.color;
    ctx.lineWidth = 2 + g.layer*0.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(g.layer*2, -g.h*0.5, 0, -g.h);
    ctx.stroke();
    ctx.restore();
  }
}

function drawObject(o){
  const px = o.x + o.wobble;
  const shadowY = H - 120;
  const dist = Math.max(0, (shadowY - o.y) / 400);
  const shadowSize = Math.max(0.2, 1 - dist);
  ctx.fillStyle = `rgba(0,0,0,${0.3*shadowSize})`;
  ctx.beginPath();
  ctx.ellipse(px, shadowY + 10, 25*shadowSize, 8*shadowSize, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.save();
  ctx.translate(px, o.y);
  ctx.rotate(o.rot);

  let glowColor = null;
  if(o.type === 'coin') glowColor = 'rgba(255,216,32,0.5)';
  else if(o.type === 'golden') glowColor = 'rgba(255,216,32,0.8)';
  else if(o.type === 'skull') glowColor = 'rgba(255,0,0,0.6)';
  else if(o.type === 'fruit') glowColor = 'rgba(255,200,100,0.3)';

  if(glowColor){
    const glowR = o.type === 'golden' ? 60 : (o.type === 'skull' ? 50 : 35);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
    grad.addColorStop(0, glowColor);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, glowR, 0, Math.PI*2);
    ctx.fill();
  }

  if(o.type === 'fruit'){
    ctx.font = '56px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(FRUITS[o.fruitIndex].emoji, 0, 0);
  } else if(o.type === 'coin'){
    drawCoin(ctx);
  } else if(o.type === 'golden'){
    drawGolden(ctx);
  } else if(o.type === 'skull'){
    drawSkull(ctx);
  }
  ctx.restore();
}

function drawCoin(c){
  const r = 26;
  c.fillStyle = 'rgba(0,0,0,0.3)';
  c.beginPath(); c.arc(2, 3, r, 0, Math.PI*2); c.fill();
  const grad = c.createRadialGradient(-8, -8, 2, 0, 0, r);
  grad.addColorStop(0, '#fff4a0');
  grad.addColorStop(0.5, '#ffcc40');
  grad.addColorStop(1, '#8a6000');
  c.fillStyle = grad;
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI*2); c.fill();
  c.strokeStyle = '#5a4000'; c.lineWidth = 3;
  c.beginPath(); c.arc(0, 0, r-2, 0, Math.PI*2); c.stroke();
  c.fillStyle = 'rgba(255,240,150,0.8)';
  c.beginPath(); c.arc(0, 0, r*0.7, 0, Math.PI*2); c.fill();
  c.fillStyle = '#8a6000';
  c.font = 'bold 26px Arial';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('$', 0, 2);
  c.fillStyle = 'rgba(255,255,255,0.7)';
  c.beginPath(); c.arc(-8, -10, 6, 0, Math.PI*2); c.fill();
}

function drawGolden(c){
  const w = 70, h = 40;
  const grad = c.createLinearGradient(-w/2, -h/2, w/2, h/2);
  grad.addColorStop(0, '#fff8a0');
  grad.addColorStop(0.5, '#ffd820');
  grad.addColorStop(1, '#8a6000');
  c.fillStyle = grad;
  c.beginPath();
  c.moveTo(-w/2, -h/2); c.lineTo(w/2, -h/2);
  c.lineTo(w/2 + 8, h/2); c.lineTo(-w/2 + 8, h/2);
  c.closePath(); c.fill();
  const grad2 = c.createLinearGradient(-w/2, -h/2, w/2, -h/4);
  grad2.addColorStop(0, '#ffffd0');
  grad2.addColorStop(1, '#ffe860');
  c.fillStyle = grad2;
  c.beginPath();
  c.moveTo(-w/2, -h/2); c.lineTo(w/2, -h/2);
  c.lineTo(w/2 - 10, -h/2 + h*0.35); c.lineTo(-w/2 - 10, -h/2 + h*0.35);
  c.closePath(); c.fill();
  c.strokeStyle = '#5a4000'; c.lineWidth = 2;
  c.beginPath();
  c.moveTo(-w/2, -h/2); c.lineTo(w/2, -h/2);
  c.lineTo(w/2 + 8, h/2); c.lineTo(-w/2 + 8, h/2);
  c.closePath(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,0.8)';
  c.beginPath();
  c.ellipse(-15, -12, 12, 5, 0, 0, Math.PI*2);
  c.fill();
  c.fillStyle = '#8a6000';
  drawStar(c, 0, 5, 8, 5);
}

function drawStar(c, cx, cy, r, points){
  c.beginPath();
  for(let i=0;i<points*2;i++){
    const ang = (Math.PI / points) * i - Math.PI/2;
    const rad = i % 2 === 0 ? r : r*0.45;
    const x = cx + Math.cos(ang)*rad;
    const y = cy + Math.sin(ang)*rad;
    if(i === 0) c.moveTo(x, y); else c.lineTo(x, y);
  }
  c.closePath(); c.fill();
}

function drawSkull(c){
  const r = 32;
  c.fillStyle = 'rgba(0,0,0,0.4)';
  c.beginPath(); c.ellipse(3, 3, r*0.9, r, 0, 0, Math.PI*2); c.fill();
  const grad = c.createRadialGradient(-8, -8, 5, 0, 0, r);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(1, '#b0b0a0');
  c.fillStyle = grad;
  c.beginPath(); c.ellipse(0, -3, r*0.85, r, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = '#e8e8d8';
  c.beginPath(); c.ellipse(0, r*0.7, r*0.55, r*0.35, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = '#000000';
  c.beginPath(); c.arc(-r*0.35, -r*0.15, r*0.28, 0, Math.PI*2); c.arc(r*0.35, -r*0.15, r*0.28, 0, Math.PI*2); c.fill();
  c.fillStyle = '#ff0000';
  c.beginPath(); c.arc(-r*0.35, -r*0.15, r*0.16, 0, Math.PI*2); c.arc(r*0.35, -r*0.15, r*0.16, 0, Math.PI*2); c.fill();
  c.fillStyle = '#ffcc88';
  c.beginPath(); c.arc(-r*0.32, -r*0.15, r*0.07, 0, Math.PI*2); c.arc(r*0.32, -r*0.15, r*0.07, 0, Math.PI*2); c.fill();
  c.fillStyle = '#000000';
  c.beginPath(); c.moveTo(0, r*0.15); c.lineTo(-r*0.08, r*0.35); c.lineTo(r*0.08, r*0.35); c.closePath(); c.fill();
  c.strokeStyle = '#000000'; c.lineWidth = 2;
  for(let i=0;i<5;i++){
    const tx = -r*0.4 + i*r*0.2;
    c.beginPath(); c.moveTo(tx, r*0.55); c.lineTo(tx, r*0.75); c.stroke();
  }
}

function drawHole(){
  const p = 1 + Math.sin(hole.pulse)*0.05;
  const hue = hole.hue;
  for(let i=0;i<20;i++){
    const t = i/20;
    const r = (240 - t*140) * p;
    const a = 0.005 + Math.pow(t, 2.5)*0.03;
    ctx.fillStyle = `rgba(${hue.r},${hue.g*0.5},${hue.b*0.4},${a})`;
    ctx.beginPath();
    ctx.arc(hole.x, hole.y, r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.save();
  ctx.translate(hole.x, hole.y);
  for(let i=0;i<30;i++){
    const ang = (i/30)*Math.PI*2 + hole.rot*0.4;
    const lenMult = 1 + Math.sin(hole.pulse*1.5 + i*1.7)*0.4;
    const rayLen = (200 + Math.sin(i*2.3)*70) * p * lenMult;
    const endX = Math.cos(ang)*rayLen;
    const endY = Math.sin(ang)*0.42*rayLen;
    ctx.strokeStyle = `rgba(${hue.r},${hue.g*0.7},${hue.b*0.4},${0.08 + Math.sin(hole.pulse+i)*0.04})`;
    ctx.lineWidth = 2.5 + Math.sin(i*1.3 + hole.pulse)*1.5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(endX, endY); ctx.stroke();
  }
  ctx.restore();

  drawDisk(hole.x, hole.y, p, hue, true);

  ctx.save();
  ctx.translate(hole.x, hole.y);
  ctx.strokeStyle = 'rgba(255,230,150,0.85)';
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.ellipse(0, 0, 82*p, 82*p*0.42, 0, Math.PI + 0.15, Math.PI*2 - 0.15);
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = 'rgba(255,150,50,0.55)';
  ctx.beginPath(); ctx.arc(hole.x, hole.y, 74*p, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,90,25,0.85)';
  ctx.beginPath(); ctx.arc(hole.x, hole.y, 66*p, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = 'rgba(255,250,220,1)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(hole.x, hole.y, 62*p, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,1)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(hole.x, hole.y, 60*p, 0, Math.PI*2); ctx.stroke();

  ctx.fillStyle = '#000000';
  ctx.beginPath(); ctx.arc(hole.x, hole.y, 56*p, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(hole.x, hole.y, 52*p, 0, Math.PI*2); ctx.fill();

  drawDisk(hole.x, hole.y, p, hue, false);

  ctx.save();
  ctx.translate(hole.x, hole.y);
  ctx.strokeStyle = 'rgba(255,180,90,0.75)';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.ellipse(0, 0, 82*p, 82*p*0.42, 0, 0.15, Math.PI - 0.15);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.translate(hole.x, hole.y);
  for(let i=0;i<28;i++){
    const ang = hole.rot*2.5 + i*Math.PI*2/28;
    const rr = 155 + Math.sin(hole.pulse*3.5 + i)*16;
    const sx = Math.cos(ang)*rr;
    const sy = Math.sin(ang)*rr*0.42;
    const sz = 7 + Math.sin(hole.pulse*5 + i)*2.5;
    const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, sz*2);
    grad.addColorStop(0, `rgba(${hue.r},${hue.g*0.5},${hue.b*0.3},0.5)`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(sx, sy, sz*2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,220,100,0.9)';
    ctx.beginPath(); ctx.arc(sx, sy, sz*0.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,240,1)';
    ctx.beginPath(); ctx.arc(sx, sy, sz*0.2, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawDisk(cx, cy, p, hue, isBack){
  const segs = 72;
  const startA = hole.rot;
  ctx.save();
  ctx.translate(cx, cy);
  for(let i=0;i<segs;i++){
    const a1 = (i/segs)*Math.PI*2 + startA;
    const a2 = ((i+1)/segs)*Math.PI*2 + startA;
    const sy1 = Math.sin(a1);
    if(isBack && sy1 > 0) continue;
    if(!isBack && sy1 < 0) continue;
    const heat = 0.5 + 0.5*Math.sin(a1*3 + hole.pulse*1.5);
    const rIn = 90*p, rOut = 140*p, tilt = 0.42;
    const v1i_x = Math.cos(a1)*rIn, v1i_y = Math.sin(a1)*rIn*tilt;
    const v2i_x = Math.cos(a2)*rIn, v2i_y = Math.sin(a2)*rIn*tilt;
    const v1o_x = Math.cos(a1)*rOut, v1o_y = Math.sin(a1)*rOut*tilt;
    const v2o_x = Math.cos(a2)*rOut, v2o_y = Math.sin(a2)*rOut*tilt;
    let r, g, b, a;
    if(heat > 0.7){ r=255; g=250; b=210; a=0.95; }
    else if(heat > 0.4){ r=255; g=200; b=90; a=0.85; }
    else { r=255; g=120; b=30; a=0.7; }
    ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
    ctx.beginPath();
    ctx.moveTo(v1i_x, v1i_y);
    ctx.lineTo(v2i_x, v2i_y);
    ctx.lineTo(v2o_x, v2o_y);
    ctx.lineTo(v1o_x, v1o_y);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawParticles(){
  for(const p of particles){
    const t = p.life / p.maxLife;
    if(p.flash){
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size*(1-t+1));
      grad.addColorStop(0, `rgba(255,255,255,${t*0.7})`);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*(1-t+1), 0, Math.PI*2); ctx.fill();
    } else {
      ctx.globalAlpha = t;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*t, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawUI(){
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, W, 140);
  ctx.restore();

  ctx.font = 'bold 46px Arial';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.strokeStyle = '#3a1a00'; ctx.lineWidth = 8;
  ctx.strokeText(`🪙 ${state.coins}`, 30, 20);
  ctx.fillStyle = '#ffea3a';
  ctx.fillText(`🪙 ${state.coins}`, 30, 20);

  let hearts = '';
  for(let i=0;i<state.maxLives;i++) hearts += i < state.lives ? '❤' : '🖤';
  ctx.strokeStyle = '#500'; ctx.lineWidth = 6;
  ctx.strokeText(hearts, 30, 80);
  ctx.fillStyle = '#ff3a5a';
  ctx.fillText(hearts, 30, 80);

  ctx.textAlign = 'center';
  ctx.font = 'bold 38px Arial';
  ctx.strokeStyle = '#004a80'; ctx.lineWidth = 8;
  ctx.strokeText(`⚡ Ур. ${state.speedLevel}`, W/2, 20);
  ctx.fillStyle = '#a0e8ff';
  ctx.fillText(`⚡ Ур. ${state.speedLevel}`, W/2, 20);

  ctx.font = 'bold 22px Arial';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
  ctx.strokeText('💀 = смерть!', W/2, 80);
  ctx.fillStyle = '#ff8080';
  ctx.fillText('💀 = смерть!', W/2, 80);

  if(state.boostActive){
    ctx.textAlign = 'center';
    ctx.font = 'bold 42px Arial';
    ctx.strokeStyle = '#804000'; ctx.lineWidth = 8;
    ctx.strokeText(`⚡ x5  ${state.boostTimer.toFixed(1)}с`, W/2, 120);
    ctx.fillStyle = '#ffea3a';
    ctx.fillText(`⚡ x5  ${state.boostTimer.toFixed(1)}с`, W/2, 120);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(W/2-200, 170, 400, 12);
    ctx.fillStyle = '#ffea3a';
    ctx.fillRect(W/2-200, 170, 400*(state.boostTimer/state.boostDuration), 12);
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

// ==================== КОНЕЦ ИГРЫ ====================
function gameOver(){
  state.gameOver = true;
  state.running = false;
  setTimeout(() => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:200;color:#fff;text-align:center;padding:20px';
    overlay.innerHTML = `
      <h1 style="font-size:60px;color:#ff5050;margin-bottom:20px">💀 GAME OVER</h1>
      <p style="font-size:36px;margin-bottom:10px">🪙 Монет: ${state.coins}</p>
      <p style="font-size:32px;margin-bottom:40px">⚡ Уровень: ${state.speedLevel}</p>
      <button id="restartBtn" style="padding:24px 60px;font-size:30px;font-weight:bold;color:#1a0a2e;background:linear-gradient(180deg,#ffd966,#ffaa22);border:none;border-radius:50px;cursor:pointer;box-shadow:0 8px 20px rgba(255,170,34,.5)">🔄 ИГРАТЬ СНОВА</button>
    `;
    document.body.appendChild(overlay);
    document.getElementById('restartBtn').addEventListener('click', () => location.reload());
  }, 800);
}

// ==================== СТАРТ ====================
function startGame(){
  document.getElementById('startScreen').style.display = 'none';
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  state.running = true;
  state.gameOver = false;
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function loop(now){
  if(!state.running) return;
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  if(!state.gameOver) update(dt);
  draw();
  if(state.running) requestAnimationFrame(loop);
}

document.getElementById('startBtn').addEventListener('click', startGame);
</script>
